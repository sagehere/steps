name: Build multi-arch image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest -v
      - name: Verify bind-mounted data directory
        run: |
          docker build -t zepp-steps-smoke .
          mkdir smoke-data
          docker run -d --name zepp-steps-smoke \
            -e ADMIN_PASSWORD=test-password \
            -e APP_SECRET=0123456789abcdef0123456789abcdef \
            -e COOKIE_SECURE=false \
            -v "${{ github.workspace }}/smoke-data:/data" \
            -p 18000:8000 zepp-steps-smoke
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:18000/healthz; then break; fi
            sleep 1
          done
          test -f smoke-data/app.db
          docker exec zepp-steps-smoke grep -E '^Uid:[[:space:]]+10001' /proc/1/status
      - if: always()
        run: docker rm -f zepp-steps-smoke || true

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/sagehere/zepp-steps
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=multiarch
          cache-to: type=gha,mode=max,scope=multiarch
